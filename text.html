<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar with Logo and Hamburger</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
     <style>
        /* Basic styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f4f4f4;
}

/* Header and navigation styling */
header {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

nav {
    display: flex;
    justify-content: space-between; /* Space between logo and hamburger */
    align-items: center;
    width: 100%;
    max-width: 1200px;
    padding: 0 20px;
}

.logo img {
    height: 50px;
}

ul {
    display: flex;
    justify-content: center;
    align-items: center;
    list-style-type: none;
    flex: 1;
}

ul li {
    margin: 0 20px;
}

ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    transition: color 0.3s;
}

ul li a:hover {
    color: #007BFF;
}

/* Hamburger menu styling */
.hamburger {
    display: none;
    cursor: pointer;
    font-size: 30px;
    color: #333;
}

/* Responsive Design */
@media (max-width: 768px) {
    nav {
        flex-direction: row; /* Maintain row direction for logo and hamburger */
        align-items: center;
    }

    .logo {
        margin-right: auto; /* Push the logo to the left */
    }

    ul {
        flex-direction: column;
        width: 100%;
        align-items: flex-start;
        display: none; /* Initially hide the menu */
    }

    ul li {
        margin: 10px 0;
    }

    .hamburger {
        display: block; /* Show the hamburger icon */
    }

    .hamburger.active + ul {
        display: block; /* Show the menu when hamburger is clicked */
    }
}

     </style>
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <a href="#"><img src="logo.png" alt="Logo"></a>
            </div>
            <div class="hamburger" id="hamburger">
                <span>&#9776;</span> <!-- Hamburger icon -->
            </div>
            <ul id="menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <script>
        // Hamburger menu toggle functionality
        const hamburger = document.getElementById('hamburger');
        const menu = document.getElementById('menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active'); // Toggle the active class on hamburger
            menu.classList.toggle('active'); // Toggle the visibility of the menu
        });

    </script>
    <!-- <script src="script.js"></script> Link to external JS file for hamburger functionality -->
</body>

</html>
